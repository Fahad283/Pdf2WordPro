# Deploy with docker-compose.yml and compose.scanning.yml.
x-production-env: &production-env
  ENVIRONMENT: production
  COOKIE_SECURE: "true"
  CLAMAV_REQUIRED: "true"

services:
  frontend:
    ports: !reset []
    environment:
      TRUST_EDGE_PROXY: "true"

  api:
    environment:
      <<: *production-env
      FORWARDED_ALLOW_IPS: "*"

  worker:
    environment: *production-env

  benchmark-worker:
    environment: *production-env

  beat:
    environment: *production-env

  migrate:
    environment: *production-env

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:?Set TLS_DIR to the directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
